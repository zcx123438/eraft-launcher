name: Build ecraft launcher (Windows / macOS / Android)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  build-desktop:
    name: 桌面端 - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install

      - name: 打包 Windows（NSIS 安装包 + 便携版）
        if: runner.os == 'Windows'
        run: npm run dist:win -- --publish never

      - name: 打包 macOS（DMG）
        if: runner.os == 'macOS'
        run: npm run dist:mac -- --publish never

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ecraft-${{ runner.os }}
          path: |
            dist_electron/*.exe
            dist_electron/*.dmg
          if-no-files-found: error

      - name: 发布到 Release（tag 推送时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_electron/*.exe
            dist_electron/*.dmg

  build-android:
    name: 安卓端 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装依赖并生成安卓工程
        run: |
          npm install
          npx cap add android || npx cap sync android
          npx cap copy android

      - name: 构建 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ecraft-android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 发布到 Release（tag 推送时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
